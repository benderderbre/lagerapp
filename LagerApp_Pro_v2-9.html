const {useState,useEffect,useCallback,useRef} = React;

// ── FIREBASE REALTIME SYNC
function useFirestore(docName, fallback) {
  const [data, setData] = useState(fallback);
  const [ready, setReady] = useState(false);
  useEffect(() => {
    const db = window._db;
    if (!db) { setReady(true); return; }
    const ref = db.collection("lagerapp").doc(docName);
    const unsub = ref.onSnapshot((snap) => {
      if (snap.exists) { setData(snap.data().value || fallback); }
      else { ref.set({ value: fallback }); }
      setReady(true);
    }, () => setReady(true));
    return () => unsub();
  }, [docName]);
  const save = useCallback(async (val) => {
    setData(val);
    const db = window._db;
    if (!db) return;
    await db.collection("lagerapp").doc(docName).set({ value: val });
  }, [docName]);
  return [data, save, ready];
}

// ── FIRESTORE: Jedes Regal als eigenes Dokument (skalierbar)
function useShelfProducts(shelfId) {
  const [data, setData] = useState([]);
  const [ready, setReady] = useState(false);
  useEffect(() => {
    if(!shelfId) return;
    const db = window._db;
    if(!db){
      // Kein Firebase: Seed-Daten lokal nutzen
      setData(SHELF_SEED[shelfId] || []);
      setReady(true);
      return;
    }
    const ref = db.collection("shelves").doc(shelfId);
    const unsub = ref.onSnapshot(snap => {
      if(snap.exists){
        setData(snap.data().items || []);
      } else {
        // Noch kein Dokument: Beispieldaten einmalig anlegen (Migration)
        const seed = SHELF_SEED[shelfId] || [];
        ref.set({ items: seed });
        setData(seed);
      }
      setReady(true);
    }, () => setReady(true));
    return () => unsub();
  }, [shelfId]);
  const save = useCallback(async (items) => {
    setData(items);
    const db = window._db;
    if(!db) return;
    await db.collection("shelves").doc(shelfId).set({ items });
  }, [shelfId]);
  return [data, save, ready];
}

// ── FIRESTORE: Alle Regale für Suche + Übersicht (nur IDs + Artikelzahl)
function useAllShelfIndex() {
  const [index, setIndex] = useState(SHELF_SEED); // Seed als Startwert damit Suche sofort klappt
  useEffect(() => {
    const db = window._db;
    if(!db) return;
    const unsub = db.collection("shelves").onSnapshot(snap => {
      if(snap.empty){
        // Noch nichts in Firebase — Seed anzeigen bis Regale geöffnet werden
        setIndex(SHELF_SEED);
        return;
      }
      const idx = {};
      snap.forEach(doc => { idx[doc.id] = doc.data().items || []; });
      setIndex(idx);
    }, ()=>{});
    return () => unsub();
  }, []);
  return index;
}

// ── FOTO-KOMPRIMIERUNG: Garantiert ≤80KB — reduziert Qualität + Größe iterativ
async function compressPhoto(dataUrl, maxBytes=80*1024) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let width = img.width;
      let height = img.height;
      // Erst auf max 1200px runterskalieren
      const maxDim = 1200;
      if(width > maxDim || height > maxDim){
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      // Iterativ Qualität und Größe reduzieren bis ≤80KB
      let quality = 0.85;
      let result;
      let attempts = 0;
      do {
        canvas.width = width;
        canvas.height = height;
        ctx.clearRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        result = canvas.toDataURL('image/jpeg', quality);
        // Base64 → Bytes: length * 0.75
        const bytes = result.length * 0.75;
        if(bytes <= maxBytes) break;
        // Noch zu groß: Qualität runter, dann Auflösung
        if(quality > 0.3) {
          quality -= 0.1;
        } else {
          width = Math.round(width * 0.8);
          height = Math.round(height * 0.8);
          quality = 0.6;
        }
        attempts++;
      } while(attempts < 12);

      resolve(result);
    };
    img.src = dataUrl;
  });
}

// ── LOGIN — mit Passwort-Einblenden
function Login({onLogin}){
  const [u,setU]=useState("");
  const [p,setP]=useState("");
  const [err,setErr]=useState("");
  const [showPw,setShowPw]=useState(false);
  const go=()=>{const f=USERS.find(x=>x.username===u&&x.password===p);f?(onLogin(f),setErr("")):setErr("Benutzername oder Passwort falsch.");};
  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0f172a,#1e3a5f,#0f2027)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"rgba(255,255,255,0.05)",backdropFilter:"blur(12px)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:20,padding:"44px 36px",width:"100%",maxWidth:380,boxShadow:"0 25px 50px rgba(0,0,0,0.5)"}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{width:60,height:60,background:"linear-gradient(135deg,#3b82f6,#1d4ed8)",borderRadius:18,margin:"0 auto 14px",display:"flex",alignItems:"center",justifyContent:"center"}}><I n="box" s={28} c="#fff"/></div>
          <h1 style={{color:"#fff",fontSize:26,fontWeight:800,letterSpacing:-0.5}}>SmartStorage.pro</h1>
          <p style={{color:"#94a3b8",fontSize:14,marginTop:4}}>Betriebsverwaltung</p>
        </div>

        <div style={{marginBottom:14}}>
          <label style={{color:"#94a3b8",fontSize:11,fontWeight:700,letterSpacing:1,display:"block",marginBottom:5}}>BENUTZERNAME</label>
          <input type="text" value={u} onChange={e=>setU(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="z.B. marco"
            style={{...inp,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.12)",color:"#fff",fontSize:15}}/>
        </div>

        <div style={{marginBottom:14}}>
          <label style={{color:"#94a3b8",fontSize:11,fontWeight:700,letterSpacing:1,display:"block",marginBottom:5}}>PASSWORT</label>
          <div style={{position:"relative"}}>
            <input type={showPw?"text":"password"} value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="••••••••"
              style={{...inp,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.12)",color:"#fff",fontSize:15,paddingRight:44}}/>
            <button onClick={()=>setShowPw(x=>!x)} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#64748b",padding:4,display:"flex",alignItems:"center"}}>
              <I n={showPw?"eyeoff":"eye"} s={16}/>
            </button>
          </div>
        </div>

        {err&&<p style={{color:"#f87171",fontSize:13,marginBottom:10,textAlign:"center"}}>{err}</p>}
        <button onClick={go} style={{width:"100%",padding:13,borderRadius:10,border:"none",background:"linear-gradient(135deg,#3b82f6,#1d4ed8)",color:"#fff",fontSize:16,fontWeight:700,marginTop:6}}>
          Anmelden
        </button>
      </div>
    </div>
  );
}

// ── SHELF MODAL — mit Stückzahl-Entnahme
function ShelfModal({shelf,user,onClose,onLogCheckout,onLogReturn,highlightItem}){
  const [nm,setNm]=useState("");
  const [qty,setQty]=useState(1);
  const [unit,setUnit]=useState("Stk");
  const [takeQty,setTakeQty]=useState({});
  // Eigenes Firestore-Dokument pro Regal
  const [items, setItems, itemsReady] = useShelfProducts(shelf.id);

  const sp=[...items].sort((a,b)=>a.name.localeCompare(b.name,"de"));

  const getTQ=(id,max)=>Math.min(Math.max(1,takeQty[id]||1),max);

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onClose}>
      <div style={{background:"#1e293b",borderRadius:20,width:"100%",maxWidth:520,maxHeight:"85vh",overflow:"auto",border:"1px solid #334155"}} onClick={e=>e.stopPropagation()}>
        <div style={{padding:"20px 20px 14px",borderBottom:"1px solid #334155",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,background:"#1e293b",zIndex:1}}>
          <div>
            <h2 style={{color:"#f1f5f9",margin:0,fontSize:18,fontWeight:700}}>{shelf.label}</h2>
            <p style={{color:"#64748b",margin:"3px 0 0",fontSize:12}}>{sp.length} Artikel · A–Z sortiert</p>
          </div>
          <button onClick={onClose} style={{background:"#334155",border:"none",borderRadius:8,padding:8,color:"#94a3b8"}}><I n="x" s={16}/></button>
        </div>
        <div style={{padding:"14px 20px"}}>
          {!itemsReady&&<p style={{color:"#64748b",textAlign:"center",padding:20}}>Laden…</p>}
          {itemsReady&&sp.length===0&&<p style={{color:"#475569",textAlign:"center",padding:20}}>Regal ist leer</p>}
          {sp.map(p=>{
            const isHL=highlightItem&&p.name.toLowerCase().includes(highlightItem.toLowerCase());
            const tq=getTQ(p.id, p.qty);
            const checkedOutAmt = p.checkedOutAmt||0;
            const available = (p.qty||0) - checkedOutAmt;
            return(
            <div key={p.id} style={{padding:"12px 0",borderBottom:"1px solid #1e3a5f",background:isHL?"#422006":"transparent",borderRadius:isHL?8:0,paddingLeft:isHL?8:0,paddingRight:isHL?8:0,marginLeft:isHL?-8:0,marginRight:isHL?-8:0}}>
              <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
                <div style={{flex:1}}>
                  <p style={{color:isHL?"#fbbf24":available<=0?"#f87171":"#f1f5f9",margin:0,fontWeight:isHL?800:600,fontSize:14}}>{isHL?"👉 ":""}{p.name}</p>
                  <p style={{color:"#64748b",margin:"3px 0 0",fontSize:12}}>
                    Gesamt: {p.qty} {p.unit} · Verfügbar: <span style={{color:available>0?"#4ade80":"#f87171",fontWeight:700}}>{available} {p.unit}</span>
                    {checkedOutAmt>0&&<span style={{color:"#f59e0b"}}> · {checkedOutAmt} entnommen</span>}
                  </p>
                </div>
                <button onClick={()=>setItems(items.filter(x=>x.id!==p.id))} style={{padding:7,borderRadius:7,border:"none",background:"#334155",color:"#94a3b8",flexShrink:0}}><I n="trash" s={13}/></button>
              </div>
              {available>0&&(
                <div style={{display:"flex",alignItems:"center",gap:6,marginTop:8}}>
                  <div style={{display:"flex",alignItems:"center",gap:4,background:"#0f172a",borderRadius:8,padding:"4px 6px"}}>
                    <button onClick={()=>setTakeQty(q=>({...q,[p.id]:Math.max(1,(q[p.id]||1)-1)}))}
                      style={{width:24,height:24,borderRadius:5,border:"none",background:"#334155",color:"#f1f5f9",fontSize:14,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
                    <input type="number" min={1} max={available} value={tq}
                      onChange={e=>setTakeQty(q=>({...q,[p.id]:Math.min(available,Math.max(1,+e.target.value))}))}
                      style={{width:44,textAlign:"center",background:"transparent",border:"none",color:"#f1f5f9",fontSize:14,fontWeight:700,outline:"none"}}/>
                    <button onClick={()=>setTakeQty(q=>({...q,[p.id]:Math.min(available,(q[p.id]||1)+1)}))}
                      style={{width:24,height:24,borderRadius:5,border:"none",background:"#334155",color:"#f1f5f9",fontSize:14,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
                  </div>
                  <span style={{color:"#64748b",fontSize:12}}>{p.unit}</span>
                  <button onClick={()=>{
                    const newItems = items.map(x=>x.id===p.id?{...x,checkedOutAmt:(x.checkedOutAmt||0)+tq,checkouts:[...(x.checkouts||[]),{user:user.name,amt:tq,at:new Date().toISOString()}]}:x);
                    setItems(newItems);
                    onLogCheckout({...p, shelfId: shelf.id}, tq);
                  }} style={{flex:1,padding:"7px 11px",borderRadius:7,border:"none",background:"#ef4444",color:"#fff",fontSize:12,fontWeight:700}}>
                    Entnehmen
                  </button>
                </div>
              )}
              {/* Rückgabe-Übersicht eigener Entnahmen */}
              {p.checkouts&&p.checkouts.filter(c=>c.user===user.name||user.role==="admin").map((c,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:7,marginTop:5,padding:"5px 8px",background:"#450a0a",borderRadius:6}}>
                  <span style={{color:"#fca5a5",fontSize:12,flex:1}}>⚠ {c.user}: {c.amt} {p.unit}</span>
                  {(c.user===user.name||user.role==="admin")&&(
                    <button onClick={()=>{
                      let removed=false;
                      const filteredCO=(p.checkouts||[]).filter(x=>{
                        if(!removed&&x.user===c.user&&x.amt===c.amt){removed=true;return false;}
                        return true;
                      });
                      const newItems=items.map(x=>x.id===p.id?{...x,checkedOutAmt:Math.max(0,(x.checkedOutAmt||0)-c.amt),checkouts:filteredCO}:x);
                      setItems(newItems);
                      onLogReturn({id:p.id,name:p.name,unit:p.unit}, c.user, c.amt);
                    }} style={{padding:"4px 9px",borderRadius:5,border:"none",background:"#10b981",color:"#fff",fontSize:11,fontWeight:700}}>Zurück</button>
                  )}
                </div>
              ))}
            </div>
          );})}

          <div style={{marginTop:16,padding:14,background:"#0f172a",borderRadius:12}}>
            <p style={{color:"#94a3b8",fontSize:12,fontWeight:700,marginBottom:10}}>Artikel hinzufügen</p>
            <input value={nm} onChange={e=>setNm(e.target.value)} placeholder="Artikelname" style={{...inp,marginBottom:8}}/>
            <div style={{display:"flex",gap:8,marginBottom:10}}>
              <input type="number" value={qty} onChange={e=>setQty(+e.target.value)} style={{...inp,flex:1}} min={1}/>
              <select value={unit} onChange={e=>setUnit(e.target.value)} style={{...inp,flex:1}}>
                {["Stk","Set","Fl","Kan","Pkg","m","kg","L","Box"].map(u=><option key={u}>{u}</option>)}
              </select>
            </div>
            <button onClick={()=>{if(nm.trim()){
              const newItem={id:Date.now(),name:nm.trim(),qty,unit,checkedOutAmt:0,checkouts:[]};
              setItems([...items, newItem]);
              setNm("");setQty(1);
            }}} style={{width:"100%",padding:10,borderRadius:8,border:"none",background:"#3b82f6",color:"#fff",fontSize:14,fontWeight:700}}>Hinzufügen</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── LAGEPLAN TAB
function LagerplanTab({user,onLogCheckout,onLogReturn}){
  const [sel,setSel]=useState(null);
  const [srch,setSrch]=useState("");
  const [res,setRes]=useState(null);
  const [hi,setHi]=useState(null);
  const [hlItem,setHlItem]=useState(null);
  const [floor,setFloor]=useState("EG");

  const allShelfIndex = useAllShelfIndex();
  const ALL_SHELVES_COMBINED=[...SHELVES_EG,...SHELVES_OG,...SHELVES_NH];

  const doSearch=()=>{
    if(!srch.trim()){setRes(null);setHi(null);setHlItem(null);return;}
    const q=srch.toLowerCase();
    for(const [shelfId, items] of Object.entries(allShelfIndex)){
      const found=items.find(p=>p.name.toLowerCase().includes(q));
      if(found){
        const s=ALL_SHELVES_COMBINED.find(x=>x.id===shelfId);
        setRes({product:found,shelf:s});setHi(shelfId);setHlItem(found.name);setSel(shelfId);
        // Switch to correct floor
        if(shelfId.startsWith("OG-")) setFloor("OG");
        else if(shelfId.startsWith("NH-")) setFloor("NH");
        else setFloor("EG");
        return;
      }
    }
    setRes({nf:true});setHi(null);setHlItem(null);
  };

  const currentShelves=floor==="EG"?SHELVES_EG:floor==="OG"?SHELVES_OG:SHELVES_NH;
  const selShelf=ALL_SHELVES_COMBINED.find(s=>s.id===sel);
  const click=(id)=>setSel(id);
  const hl=(id)=>hi===id?"#fbbf24":undefined;
  const sw=(id)=>hi===id?"2":"1.5";

  return(
    <div style={{padding:12}}>
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        <div style={{flex:1,position:"relative"}}>
          <div style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",color:"#64748b",pointerEvents:"none"}}><I n="search" s={15}/></div>
          <input value={srch} onChange={e=>setSrch(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doSearch()} placeholder="Produkt suchen…" style={{...inp,paddingLeft:32}}/>
        </div>
        <button onClick={doSearch} style={{padding:"10px 14px",borderRadius:8,border:"none",background:"#3b82f6",color:"#fff",fontWeight:700,fontSize:13}}>Suchen</button>
        {hi&&<button onClick={()=>{setHi(null);setRes(null);setSrch("");}} style={{padding:10,borderRadius:8,border:"none",background:"#334155",color:"#94a3b8"}}><I n="x" s={15}/></button>}
      </div>

      {res&&(
        <div style={{padding:"10px 13px",borderRadius:10,background:res.nf?"#450a0a":"#052e16",border:`1px solid ${res.nf?"#7f1d1d":"#14532d"}`,marginBottom:12}}>
          {res.nf
            ?<p style={{color:"#fca5a5",margin:0}}>Kein Artikel gefunden.</p>
            :<div><p style={{color:"#86efac",margin:0,fontWeight:700}}>{res.product.name}</p>
              <p style={{color:"#4ade80",margin:"3px 0 0",fontSize:12}}>→ {res.shelf?.label} · Verfügbar: {(res.product.qty||0)-(res.product.checkedOutAmt||0)} {res.product.unit}</p>
            </div>
          }
        </div>
      )}

      {/* Floor switcher */}
      <div style={{display:"flex",gap:8,marginBottom:10}}>
        {[["EG","🏭 EG"],["OG","🏢 OG"],["NH","🏗 Nebenhalle"]].map(([f,label])=>(
          <button key={f} onClick={()=>{setFloor(f);setSel(null);}}
            style={{flex:1,padding:"9px 0",borderRadius:8,border:`1px solid ${floor===f?"#3b82f6":"#334155"}`,
              background:floor===f?"#1e3a5f":"transparent",color:floor===f?"#60a5fa":"#64748b",fontWeight:700,fontSize:12}}>
            {label}
          </button>
        ))}
      </div>

      {floor==="OG"&&(
      <div style={{background:"#1e293b",borderRadius:10,border:"1px solid #334155",overflow:"auto"}}>
        <svg viewBox="0 0 390 620" style={{width:"100%",minWidth:300,display:"block",fontFamily:"sans-serif"}}>
          {/* Hintergrund */}
          <rect x="0" y="0" width="390" height="620" fill="#0f172a"/>
          {/* Gitter */}

// ── KFZ FORM — FIX: lokaler State, kein Firebase-Reset-Bug + Getriebe + Erste-Hilfe-Datum
const EV={plate:"",brand:"",model:"",year:new Date().getFullYear(),km:0,ps:"",drive:"FWD",gearbox:"Schaltgetriebe",towBar:false,status:"Verfügbar",nextService:"",lastService:"",firstAidDate:"",damages:[],notes:"",photo:null};
const SC={"Verfügbar":"#10b981","Im Einsatz":"#f59e0b","In Wartung":"#ef4444","Außer Dienst":"#6b7280"};

function KfzForm({initial,onSave,onCancel}){
  const [f,setF]=useState(()=>({...EV,...initial}));
  const [dmg,setDmg]=useState("");
  const fRef=useRef();
  const s=(k,v)=>setF(p=>({...p,[k]:v}));
  const addD=()=>{if(dmg.trim()){s("damages",[...f.damages,dmg.trim()]);setDmg("");}};
  const delD=(i)=>s("damages",f.damages.filter((_,j)=>j!==i));
  const handlePhoto=async e=>{
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=async ev=>{
      const compressed = await compressPhoto(ev.target.result, 80*1024); // max 80KB
      s("photo", compressed);
    };
    r.readAsDataURL(file);
  };

  return(
    <div style={{background:"#1e293b",borderRadius:16,padding:18,marginBottom:14,border:"1px solid #334155"}}>
      <h3 style={{color:"#f1f5f9",margin:"0 0 14px",fontSize:16,fontWeight:700}}>{initial.id?"Bearbeiten":"Neues Fahrzeug"}</h3>

      <div style={{marginBottom:14,textAlign:"center"}}>
        {f.photo
          ?<div style={{position:"relative",display:"inline-block",width:"100%"}}>
            <img src={f.photo} alt="Fzg" style={{width:"100%",maxHeight:180,objectFit:"cover",borderRadius:10,border:"2px solid #334155"}}/>
            <button onClick={()=>s("photo",null)} style={{position:"absolute",top:6,right:6,padding:5,borderRadius:6,border:"none",background:"rgba(0,0,0,0.7)",color:"#fff"}}><I n="x" s={12}/></button>
          </div>
          :<button onClick={()=>fRef.current.click()} style={{width:"100%",padding:"22px 0",borderRadius:10,border:"2px dashed #334155",background:"transparent",color:"#475569",display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
            <I n="camera" s={22}/><span style={{fontSize:13}}>Foto hinzufügen</span>
          </button>
        }
        <input type="file" accept="image/*" ref={fRef} onChange={handlePhoto} style={{display:"none"}}/>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9,marginBottom:10}}>
        {[["Kennzeichen","plate","text"],["Marke","brand","text"],["Modell","model","text"],["Baujahr","year","number"],["KM-Stand","km","number"],["PS Leistung","ps","number"]].map(([l,k,t])=>(
          <div key={k}>
            <label style={{color:"#94a3b8",fontSize:11,fontWeight:700,display:"block",marginBottom:3}}>{l}</label>
            <input type={t} value={f[k]} onChange={e=>s(k,t==="number"?+e.target.value:e.target.value)} style={inp}/>
          </div>
        ))}

        <div>
          <label style={{color:"#94a3b8",fontSize:11,fontWeight:700,display:"block",marginBottom:3}}>Antrieb</label>
          <select value={f.drive} onChange={e=>s("drive",e.target.value)} style={inp}>
            {[["FWD","FWD (Vorderrad)"],["RWD","RWD (Hinterrad)"],["AWD","AWD (Allrad)"],["4WD","4WD (Zuschaltbar)"]].map(([v,l])=><option key={v} value={v}>{l}</option>)}
          </select>
        </div>

        <div>
          <label style={{color:"#94a3b8",fontSize:11,fontWeight:700,display:"block",marginBottom:3}}>Getriebe</label>
          <select value={f.gearbox||"Schaltgetriebe"} onChange={e=>s("gearbox",e.target.value)} style={inp}>
            <option>Schaltgetriebe</option>
            <option>Automatik</option>
          </select>
        </div>

        <div>
          <label style={{color:"#94a3b8",fontSize:11,fontWeight:700,display:"block",marginBottom:3}}>Status</label>
          <select value={f.status} onChange={e=>s("status",e.target.value)} style={inp}>
            {Object.keys(SC).map(x=><option key={x}>{x}</option>)}
          </select>
        </div>

        <div>
          <label style={{color:"#94a3b8",fontSize:11,fontWeight:700,display:"block",marginBottom:3}}>Nächste Wartung</label>
          <input type="date" value={f.nextService} onChange={e=>s("nextService",e.target.value)} style={inp}/>
        </div>

        <div>
          <label style={{color:"#94a3b8",fontSize:11,fontWeight:700,display:"block",marginBottom:3}}>Letzte Wartung</label>
          <input type="date" value={f.lastService} onChange={e=>s("lastService",e.target.value)} style={inp}/>
        </div>

        <div style={{gridColumn:"1 / -1"}}>
          <label style={{color:"#94a3b8",fontSize:11,fontWeight:700,display:"block",marginBottom:3}}>Erste-Hilfe-Kasten (Ablauf)</label>
          <input type="date" value={f.firstAidDate||""} onChange={e=>s("firstAidDate",e.target.value)} style={inp}/>
        </div>
      </div>

      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12,padding:"9px 11px",background:"#0f172a",borderRadius:8}}>
        <input type="checkbox" id="ahk" checked={f.towBar} onChange={e=>s("towBar",e.target.checked)} style={{width:16,height:16}}/>
        <label htmlFor="ahk" style={{color:"#e2e8f0",fontSize:14}}>Anhängerkupplung (AHK) vorhanden</label>
      </div>

      <div style={{marginBottom:12}}>
        <label style={{color:"#94a3b8",fontSize:11,fontWeight:700,display:"block",marginBottom:8}}>SCHÄDEN</label>
        {f.damages.map((d,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:7,marginBottom:5}}>
            <div style={{flex:1,padding:"7px 10px",background:"#0f172a",borderRadius:7,display:"flex",alignItems:"center",gap:5}}>
              <I n="warn" s={12} c="#f59e0b"/><span style={{color:"#fca5a5",fontSize:13}}>{d}</span>
            </div>
            <button onClick={()=>delD(i)} style={{padding:6,borderRadius:6,border:"none",background:"#334155",color:"#94a3b8"}}><I n="x" s={12}/></button>
          </div>
        ))}
        <div style={{display:"flex",gap:7}}>
          <input value={dmg} onChange={e=>setDmg(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addD()} placeholder="Schaden beschreiben…" style={{...inp,flex:1}}/>
          <button onClick={addD} style={{padding:"10px 12px",borderRadius:8,border:"none",background:"#334155",color:"#f59e0b",fontWeight:700,whiteSpace:"nowrap"}}>+ Hinzu</button>
        </div>
      </div>

      <div style={{marginBottom:14}}>
        <label style={{color:"#94a3b8",fontSize:11,fontWeight:700,display:"block",marginBottom:4}}>NOTIZEN</label>
        <input value={f.notes} onChange={e=>s("notes",e.target.value)} style={inp}/>
      </div>

      <div style={{display:"flex",gap:9}}>
        <button onClick={()=>onSave(f)} style={{flex:1,padding:11,borderRadius:8,border:"none",background:"#3b82f6",color:"#fff",fontWeight:700,fontSize:15}}>Speichern</button>
        <button onClick={onCancel} style={{padding:11,borderRadius:8,border:"none",background:"#334155",color:"#94a3b8",fontSize:14}}>Abbrechen</button>
      </div>
    </div>
  );
}

// ── KFZ TAB — FIX: editing State bleibt stabil, kein Auto-Reset
function KfzTab({user}){
  const [vehicles,setVehicles,vReady]=useFirestore("vehicles",INIT_VEHICLES);
  const [editing,setEditing]=useState(null);
  const DL={"FWD":"Vorderrad","RWD":"Hinterrad","AWD":"Allrad","4WD":"4×4"};
  const GB={"Schaltgetriebe":"Schaltung","Automatik":"Automatik"};

  // FIX: Foto bereits komprimiert (<80KB) direkt in Firebase speichern
  const save=useCallback(async (f)=>{
    let updated;
    const vehicleToSave = {...f};
    if(editing==="new"){
      updated=[...vehicles,{...vehicleToSave,id:Date.now()}];
    } else {
      updated=vehicles.map(v=>v.id===editing?{...vehicleToSave,id:v.id}:v);
    }
    await setVehicles(updated);
    setEditing(null);
  },[editing,vehicles,setVehicles]);

  if(!vReady) return <div style={{padding:40,textAlign:"center",color:"#64748b"}}>Laden…</div>;

  // Fotos direkt aus Firebase (komprimiert gespeichert)
  const vehiclesWithPhotos = vehicles;

  return(
    <div style={{padding:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div>
          <h2 style={{color:"#f1f5f9",margin:0,fontSize:20,fontWeight:700}}>Fuhrpark</h2>
          <p style={{color:"#64748b",margin:"3px 0 0",fontSize:13}}>{vehicles.length} Fahrzeuge</p>
        </div>
        {user.role==="admin"&&!editing&&(
          <button onClick={()=>setEditing("new")} style={{padding:"9px 14px",borderRadius:9,border:"none",background:"#3b82f6",color:"#fff",fontWeight:700,display:"flex",alignItems:"center",gap:5,fontSize:13}}>
            <I n="plus" s={14}/> Fahrzeug
          </button>
        )}
      </div>

      {editing==="new"&&<KfzForm initial={EV} onSave={save} onCancel={()=>setEditing(null)}/>}

      {vehiclesWithPhotos.map(v=>(
        <div key={v.id}>
          {editing===v.id
            ?<KfzForm initial={v} onSave={save} onCancel={()=>setEditing(null)}/>
            :<div style={{background:"#1e293b",borderRadius:14,marginBottom:10,border:"1px solid #334155",overflow:"hidden"}}>
              {v.photo&&<img src={v.photo} alt={v.plate} style={{width:"100%",maxHeight:170,objectFit:"cover",display:"block"}}/>}
              <div style={{padding:"14px 15px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap",marginBottom:5}}>
                      {v.plate&&<span style={{background:"#0f172a",padding:"4px 10px",borderRadius:6,color:"#f1f5f9",fontWeight:800,fontSize:14,letterSpacing:1}}>{v.plate}</span>}
                      <span style={{padding:"3px 8px",borderRadius:6,background:(SC[v.status]||"#6b7280")+"22",color:SC[v.status]||"#6b7280",fontSize:11,fontWeight:700}}>{v.status}</span>
                      {v.towBar&&<span style={{padding:"3px 8px",borderRadius:6,background:"#0c4a6e22",color:"#38bdf8",fontSize:11,fontWeight:700}}>AHK ✓</span>}
                    </div>
                    <p style={{color:"#e2e8f0",margin:"0 0 5px",fontWeight:600,fontSize:14}}>{v.brand} {v.model} <span style={{color:"#64748b",fontWeight:400}}>{v.year?`(${v.year})`:""}</span></p>
                  </div>
                  {user.role==="admin"&&(
                    <div style={{display:"flex",gap:6,marginLeft:8}}>
                      <button onClick={()=>setEditing(v.id)} style={{padding:7,borderRadius:7,border:"none",background:"#334155",color:"#94a3b8"}}><I n="edit" s={13}/></button>
                      <button onClick={()=>{ setVehicles(vehicles.filter(x=>x.id!==v.id)); }} style={{padding:7,borderRadius:7,border:"none",background:"#334155",color:"#94a3b8"}}><I n="trash" s={13}/></button>

// ── BÜCHEREI TAB
function BüchereiTab({log,user,onLogReturn}){
  const allActive=log.filter(e=>e.type==="checkout"&&!e.returned).sort((a,b)=>new Date(b.at)-new Date(a.at));
  const myActive=user.role==="admin"?allActive:allActive.filter(e=>e.user===user.name);
  const hist=[...log].sort((a,b)=>new Date(b.at)-new Date(a.at)).slice(0,60);
  const byUser={};
  allActive.forEach(e=>{if(!byUser[e.user])byUser[e.user]=[];byUser[e.user].push(e);});

// ── MAIN APP
function App(){
  const [user,setUser]=useState(()=>{try{const u=sessionStorage.getItem("lager_user");return u?JSON.parse(u):null;}catch{return null;}});
  const [tab,setTab]=useState("lager");
  const productsReady=true; // inventory now per-shelf
  const [log,setLogRaw,logReady]=useFirestore("log",[]);

  const login=u=>{setUser(u);try{sessionStorage.setItem("lager_user",JSON.stringify(u));}catch{}};
  const logout=()=>{setUser(null);try{sessionStorage.removeItem("lager_user");}catch{}};

  if(!user) return <Login onLogin={login}/>;
  if(!productsReady||!logReady) return(
    <div style={{minHeight:"100vh",background:"#0f172a",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:12}}>
      <div style={{width:40,height:40,border:"3px solid #334155",borderTop:"3px solid #3b82f6",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
      <p style={{color:"#64748b",fontSize:14}}>Verbinde mit Datenbank…</p>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );

  // ── Nur Log-Einträge — Regal-State lebt jetzt in ShelfModal/Firestore pro Regal
  const logCheckout=(product, amt)=>{
    const now=new Date().toISOString();
    setLogRaw([...log,{id:Date.now(),productId:product.id,productName:product.name,unit:product.unit,shelfId:product.shelfId,user:user.name,at:now,type:"checkout",returned:false,amt}]);
  };
  const logReturn=(product, byUser, amt)=>{
    const now=new Date().toISOString();
    const pid = product.id || product.productId;
    const pname = product.name || product.productName;
    const punit = product.unit || "Stk";
    setLogRaw([...log.map(e=>e.productId===pid&&!e.returned&&e.user===byUser?{...e,returned:true}:e),
      {id:Date.now()+1,productId:pid,productName:pname,unit:punit,user:byUser,at:now,type:"return",returned:true,amt}]);
  };

  const tabs=[{id:"lager",label:"Lageplan",icon:"map"},{id:"kfz",label:"Kfz",icon:"car"},{id:"nav",label:"Navigation",icon:"nav"},{id:"log",label:"Bücherei",icon:"book"}];
  const coCnt=log.filter(e=>e.type==="checkout"&&!e.returned&&e.user===user.name).length;

  return(
    <div style={{minHeight:"100vh",background:"#0f172a",display:"flex",flexDirection:"column",maxWidth:700,margin:"0 auto"}}>
      <div style={{background:"#1e293b",borderBottom:"1px solid #334155",padding:"11px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",gap:9}}>
          <div style={{width:32,height:32,background:"linear-gradient(135deg,#3b82f6,#1d4ed8)",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center"}}><I n="box" s={16} c="#fff"/></div>
          <span style={{color:"#f1f5f9",fontWeight:800,fontSize:16}}>SmartStorage.pro</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:7}}>
          <div style={{display:"flex",alignItems:"center",gap:5}}>
            <div style={{width:7,height:7,borderRadius:"50%",background:user.role==="admin"?"#f59e0b":"#10b981"}}/>
            <span style={{color:"#94a3b8",fontSize:12}}>{user.name}</span>
          </div>
          <button onClick={logout} style={{padding:"6px 8px",borderRadius:8,border:"none",background:"#334155",color:"#94a3b8"}}><I n="logout" s={13}/></button>
        </div>
      </div>

      <div style={{flex:1,overflowY:"auto",paddingBottom:64}}>
        {tab==="lager"&&<LagerplanTab user={user} onLogCheckout={logCheckout} onLogReturn={logReturn}/>}
        {tab==="nav"&&(
          <div style={{minHeight:"80vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:32,gap:24}}>
            <div style={{width:72,height:72,background:"linear-gradient(135deg,#3b82f6,#1d4ed8)",borderRadius:20,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <I n="nav" s={34} c="#fff"/>
            </div>
            <div style={{textAlign:"center"}}>
              <h2 style={{color:"#f1f5f9",fontSize:22,fontWeight:800,margin:"0 0 8px"}}>Navigation zum Lager</h2>
              <p style={{color:"#64748b",fontSize:14,margin:0}}>Google Maps öffnen und Route starten?</p>
            </div>
            <a href="https://maps.app.goo.gl/RgA1hnEeiVeH6cvN6?g_st=ac" target="_blank" rel="noopener noreferrer"
              style={{display:"flex",alignItems:"center",gap:10,padding:"14px 28px",borderRadius:12,background:"linear-gradient(135deg,#3b82f6,#1d4ed8)",color:"#fff",fontSize:16,fontWeight:700,textDecoration:"none",boxShadow:"0 4px 20px rgba(59,130,246,0.4)"}}>
              <I n="nav" s={18} c="#fff"/>
              Navigation starten
            </a>
            <button onClick={()=>setTab("lager")} style={{padding:"10px 20px",borderRadius:10,border:"1px solid #334155",background:"transparent",color:"#64748b",fontSize:13}}>
              Abbrechen
            </button>
          </div>
        )}
        {tab==="kfz"&&<KfzTab user={user}/>}
        {tab==="log"&&<BüchereiTab log={log} user={user} onLogReturn={logReturn}/>}
      </div>

      <div style={{background:"#1e293b",borderTop:"1px solid #334155",display:"flex",position:"fixed",bottom:0,left:0,right:0,maxWidth:700,margin:"0 auto",zIndex:50}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"11px 8px",border:"none",background:"transparent",color:tab===t.id?"#3b82f6":"#475569",display:"flex",flexDirection:"column",alignItems:"center",gap:3,position:"relative"}}>
            {t.id==="log"&&coCnt>0&&<span style={{position:"absolute",top:7,right:"calc(50% - 17px)",background:"#ef4444",color:"#fff",borderRadius:"50%",width:15,height:15,fontSize:9,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700}}>{coCnt}</span>}
            <I n={t.icon} s={20}/>
            <span style={{fontSize:10,fontWeight:700}}>{t.label}</span>
            {tab===t.id&&<div style={{position:"absolute",bottom:0,left:"28%",right:"28%",height:2,background:"#3b82f6",borderRadius:2}}/>}
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
